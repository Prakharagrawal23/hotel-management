# ===============================
# Application Info
# ===============================
spring.application.name=hotalMgmt
server.port=9090

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/hotalmgmt_database
spring.datasource.username=root
spring.datasource.password=Genpact@123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.session.jdbc.initialize-schema=never


# ===============================
# Logging
# ===============================
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
spring.session.jdbc.initialize-schema=always

# ===============================
# JWT Configuration
# ===============================
# Secret must be at least 32 characters (256 bits) for HS256
jwt.secret=ChangeThisSecretToAStrongKey_ChangeThisSecretToAStrongKey_32bytesMin
# Token expiration in milliseconds (10 hours here)
jwt.expiration-ms=36000000
